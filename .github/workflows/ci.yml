name: CI

on:
  push:
    branches: [main, prototype/**, feat/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Database and runtime contract tests
        run: npm run test:database
      - name: Offline Opportunity Brief evidence and HTML tests
        run: node --test tests/opportunity-brief.test.mjs tests/public-evidence-import.test.mjs
      - name: Generate source-backed watermarked example HTML
        run: node scripts/generate-opportunity-brief.mjs docs/examples/HAPPY_SOULS_PUBLIC_OPPORTUNITY_INPUT_2026-10-23.json "$RUNNER_TEMP/happy-souls-opportunity-brief-draft.html"
      - name: Upload evidence-gated example preview
        uses: actions/upload-artifact@v4
        with:
          name: happy-souls-opportunity-brief-draft
          path: ${{ runner.temp }}/happy-souls-opportunity-brief-draft.html
          if-no-files-found: error
          retention-days: 7
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno tests
        run: deno test --allow-env --allow-net --allow-read supabase/functions/_shared/*.test.ts
      - name: Deno Edge function type-check
        run: deno check supabase/functions/submit-lead/index.ts supabase/functions/create-audit/index.ts supabase/functions/business-scanner/index.ts supabase/functions/get-analysis-report/index.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          VITE_SUPABASE_PROJECT_ID: "placeholder"
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
        run: npm run build
      - name: Verify build preserves reviewed source
        run: git diff --exit-code
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end · Public launch QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Run E2E
        run: npx --no-install playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
