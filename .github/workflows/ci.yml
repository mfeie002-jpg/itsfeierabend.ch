name: CI

on:
  push:
    branches: [main, prototype/**]
  pull_request:

jobs:
  build:
    name: Install · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full-repository lint debt (informational baseline)
        continue-on-error: true
        run: bun run lint
      - name: Lint changed source (no new debt)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs')
          if (( ${#files[@]} )); then
            bunx eslint "${files[@]}"
          fi
      - name: TypeScript
        run: bun run typecheck
      - name: Database and runtime contract tests
        run: bun run test:database
      - name: Deno tests (edge functions)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run deno tests
        run: deno test --allow-env --allow-net --allow-read supabase/functions/_shared/*.test.ts
      - name: Check edge function entrypoints
        run: deno check supabase/functions/submit-lead/index.ts supabase/functions/create-audit/index.ts supabase/functions/business-scanner/index.ts
      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          VITE_SUPABASE_PROJECT_ID: "placeholder"
        run: bun run build

  e2e:
    name: End-to-end · Free audit flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      - name: Build preview
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          VITE_SUPABASE_PROJECT_ID: "placeholder"
        run: bun run build
      - name: Run E2E
        run: bunx playwright test tests/e2e/audit-flow.spec.ts
